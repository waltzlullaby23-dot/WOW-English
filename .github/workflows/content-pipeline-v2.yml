name: 三木Eng Free Video Discovery V2

on:
  push:
    paths:
      - ".github/workflows/content-pipeline-v2.yml"
      - "engine/free_pipeline.py"
      - "engine/free_discover.py"
      - "engine/free_repair.py"
      - "engine/free_verify.py"
      - "engine/config.json"
      - "data/taxonomy.json"
      - "data/catalog.json"
  schedule:
    - cron: "47 1 * * *"
    - cron: "47 7 * * *"
    - cron: "47 13 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanmu-free-discovery-v2
  cancel-in-progress: true

jobs:
  discover:
    if: github.actor != 'sanmu-eng-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free pipeline
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: API discovery smoke test
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FREETRANSCRIPT_API_KEY: ${{ secrets.FREETRANSCRIPT_API_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          key=os.environ.get('YOUTUBE_API_KEY','')
          r=requests.get('https://www.googleapis.com/youtube/v3/search',
            params={'part':'snippet','q':'English learning','type':'video',
                    'maxResults':1,'key':key,'relevanceLanguage':'en',
                    'videoCaption':'closedCaption'},timeout=20)
          print('YOUTUBE_API_STATUS=',r.status_code)
          print('YOUTUBE_API_ITEMS=',len(r.json().get('items',[])) if r.ok else 0)
          if not r.ok: print('WARNING: YouTube Data API unavailable; yt-dlp search fallback will be used.')
          PY
      - name: Run discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FREETRANSCRIPT_API_KEY: ${{ secrets.FREETRANSCRIPT_API_KEY }}
        run: python engine/discover.py
      - name: Verify release data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          videos=d.get('videos',[])
          accepted=[v for v in videos if v.get('status')=='accepted' and v.get('captionQuality')=='verified']
          complete=[v for v in accepted if v.get('translation')=='available' and all(str(x.get('zh','')).strip() for x in v.get('transcript',[]))]
          print('TOTAL_VIDEOS=',len(videos))
          print('ACCEPTED=',len(accepted))
          print('FULLY_TRANSLATED=',len(complete))
          print('NEW_ACCEPTED=',d.get('stats',{}).get('newAccepted',0))
          if not accepted: raise SystemExit('Release blocked: zero accepted videos.')
          if len(complete)<len(accepted): raise SystemExit('Release blocked: accepted videos must have complete Chinese translation.')
          PY
      - name: Commit catalog updates
        run: |
          git config user.name "sanmu-eng-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/discovery-cursor.json data/discovery-health.json data/review.json
          if git diff --cached --quiet; then
            echo "NO_DATA_CHANGE=true" >> "$GITHUB_ENV"
            echo "No catalog change."
          else
            git commit -m "chore: update free video library"
            git pull --rebase origin main
            git push
          fi
