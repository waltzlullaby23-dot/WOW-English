name: 三木Eng Free Video Discovery

on:
  push:
    paths:
      - ".github/workflows/content-pipeline.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanmu-free-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install free pipeline
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run free discovery + caption verification + translation
        run: python engine/discover.py

      - name: Verify release data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          videos=d.get("videos",[])
          accepted=[v for v in videos if v.get("status")=="accepted"]
          verified=[v for v in accepted if v.get("captionQuality")=="verified"]
          translated=[v for v in verified if v.get("translation")=="available" and all(str(x.get("zh","")).strip() for x in v.get("transcript",[]))]
          print("TOTAL_VIDEOS=",len(videos))
          print("ACCEPTED=",len(accepted))
          print("VERIFIED_CAPTIONS=",len(verified))
          print("FULLY_TRANSLATED=",len(translated))
          if accepted and len(translated) < len(accepted):
              raise SystemExit("Release blocked: accepted videos must have complete sentence-level Chinese translation.")
          PY

      - name: Commit catalog updates
        run: |
          git config user.name "sanmu-eng-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/discovery-cursor.json data/discovery-health.json data/review.json
          if git diff --cached --quiet; then
            echo "NO_DATA_CHANGE=true" >> "$GITHUB_ENV"
            echo "No catalog change."
          else
            git commit -m "chore: update free video library"
            git push
          fi
